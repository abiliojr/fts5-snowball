name: Build Windows DLL

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6 # Обновлено с v4 для Node.js 24
      with:
        submodules: 'recursive'

    - name: Setup MSYS2 (UCRT64)
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64 # Мигрировано с MINGW64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-make
          git

    - name: Build with Make
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE"
        make # В UCRT64 используется обычная команда make

    - name: Rename artifact for Windows
      shell: msys2 {0}
      run: |
        mv fts5stemmer.so fts5stemmer.dll

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v6 # Обновлено с v4 для Node.js 24
      with:
        name: fts5stemmer-windows-dll
        path: fts5stemmer.dll
